<html>
<body>

<script>
function add(){
let a = document.getElementById("num1").value;
let b = document.getElementById("num2").value;
let c = Number(a) + Number(b);
document.getElementById("ans").innerHTML = c;
}

function sub(){
let a = document.getElementById("num1").value;
let b = document.getElementById("num2").value;
let c = Number(a) - Number(b);
document.getElementById("ans").innerHTML = c;
}


function mult(){
let a = document.getElementById("num1").value;
let b = document.getElementById("num2").value;
let c = Number(a) * Number(b)
document.getElementById("ans").innerHTML = c;
}


function div(){
let a = document.getElementById("num1").value;
let b = document.getElementById("num2").value;
let c = Number(a) / Number(b)
document.getElementById("ans").innerHTML = c;
}


function expo(){
let a = document.getElementById("num1").value;
let b = document.getElementById("num2").value;
let c = Number(a) ** Number(b)
document.getElementById("ans").innerHTML = c;
}


</script>


<p id="p1">
Put in your First Number: 
<input id = "num1">
<br>
Put in your Second Number:
<input id = "num2">

  <br>
<button onclick="add()"> Addition </button>
  <br>
<button onclick="sub()"> Subtraction </button>
  <br>
<button onclick="mult()"> Multiplication </button>
  <br>
<button onclick="div()"> Division </button>
  <br>
<button onclick="expo()"> Exponentiation </button>

</p>

<p>
  Your result is <span id="ans">_____________</span>
  
</p>
